<!doctype html>
<html lang="en" class="i18n-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/login.css" />
    <link rel="stylesheet" href="./css/i18n.css" />
  </head>
  <body>
    <div id="lang-switcher" style="position:absolute;top:16px;right:16px"></div>
    <div class="auth-center">
      <div class="auth-card">
        <div class="brand">
          <img src="./logo.png" alt="LetsHyre" class="brand__logo" />
        </div>

        <h1 class="auth-title" data-i18n="login.title">Sign in</h1>
        <p class="auth-subtitle" data-i18n="login.subtitle">Log in to access your dashboard and start your interview.</p>

        <div id="auth-error" class="auth-error" role="alert"></div>

        <form id="login-form" novalidate>
          <div class="field">
            <label class="field__label" for="email" data-i18n="login.emailLabel">Email</label>
            <input
              class="field__input"
              id="email"
              name="email"
              type="email"
              autocomplete="username"
              placeholder="you@example.com"
              aria-describedby="email-error"
              required
            />
            <p class="field__error" id="email-error" role="alert"></p>
          </div>

          <div class="field">
            <label class="field__label" for="password" data-i18n="login.passwordLabel">Password</label>
            <input
              class="field__input"
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              aria-describedby="password-error"
              required
            />
            <p class="field__error" id="password-error" role="alert"></p>
            <div class="field__show-password">
              <input type="checkbox" id="show-password" />
              <label for="show-password" data-i18n="login.showPassword">Show password</label>
            </div>
          </div>

          <button class="btn" id="submit-btn" type="submit">Sign in</button>
        </form>

        <p class="auth-foot" data-i18n="login.footSecured">Your session is secured for the interview.</p>
        <p class="auth-foot" style="margin-top:10px">
          <span data-i18n="login.footHowItWorksPrefix">Not sure what to expect?</span>
          <button type="button" onclick="window.electronAPI?.loadHowItWorks?.()" style="background:none;border:none;padding:0;color:#2563eb;font-size:inherit;font-family:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px" data-i18n="login.howItWorksLink">See how it works →</button>
        </p>
      </div>
    </div>

    <script src="./js/i18n.js"></script>
    <script src="../src/renderer/languageSwitcher.js"></script>
    <script src="../src/renderer/login.js"></script>
  </body>
</html>
