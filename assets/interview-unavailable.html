<!doctype html>
<html lang="en" class="i18n-pending fluid-scale">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/fonts.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/interview-unavailable.css" />
    <link rel="stylesheet" href="./css/i18n.css" />
  </head>
  <body class="iu-body">
    <main class="card iu-card" role="alert">
      <span class="iu-icon" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M2 8.8a15 15 0 0 1 4.2-2.6" />
          <path d="M10.7 5.1A15 15 0 0 1 22 8.8" />
          <path d="M5 12.5a10 10 0 0 1 5.2-2.6" />
          <path d="M16.9 10.8A10 10 0 0 1 19 12.5" />
          <path d="M8.5 16.4a5 5 0 0 1 7 0" />
          <path d="M12 20h.01" />
          <path d="M3 3l18 18" />
        </svg>
      </span>
      <h1 class="iu-title" data-i18n="interviewUnavailable.title">Can't reach your interview</h1>
      <p class="iu-body-text" data-i18n="interviewUnavailable.body">
        Check your internet connection. We'll keep trying to reconnect automatically.
      </p>
      <button
        class="btn btn--primary btn--lg"
        id="btn-retry"
        type="button"
        onclick="window.electronAPI?.retryInterview?.()"
      >
        <span data-i18n="interviewUnavailable.retry">Try again</span>
      </button>
      <button
        class="btn btn--ghost btn--lg iu-leave"
        id="btn-leave"
        type="button"
        hidden
        onclick="window.electronAPI?.loadDashboard?.()"
      >
        <span data-i18n="interviewUnavailable.leave">Back to dashboard</span>
      </button>
      <p class="iu-ref" id="iu-ref" hidden></p>
    </main>

    <script>
      document.getElementById("btn-leave").hidden = !new URLSearchParams(location.search).has(
        "leave"
      );
    </script>

    <script src="./js/i18n.js"></script>
    <script>
      // The code to quote to support, so they can find this attempt's logs.
      (function () {
        const el = document.getElementById("iu-ref");
        let code = null;
        function render() {
          el.hidden = !code;
          if (code) {
            el.textContent = window.t
              ? window.t("support.referenceCode", { code })
              : `Reference code: ${code}`;
          }
        }
        window.i18n?.registerRenderer?.(render);
        Promise.all([window.electronAPI?.getSupportInfo?.(), window.i18n?.ready])
          .then(([info]) => {
            code = typeof info?.referenceCode === "string" ? info.referenceCode : null;
            render();
          })
          .catch(() => {});
      })();
    </script>
  </body>
</html>
