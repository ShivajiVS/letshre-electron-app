<!doctype html>
<html lang="en" class="i18n-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/i18n.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__brand">
        <img src="./logo.png" alt="LetsHyre" />
      </div>

      <div class="topbar__right">
        <div id="lang-switcher"></div>
        <button class="btn-ghost" id="logout-btn" type="button">
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span data-i18n="dashboard.logout">Log out</span>
        </button>
      </div>
    </header>

    <main class="dash-main">
      <!-- Profile card -->
      <div class="profile-card" id="profile-card">
        <div class="profile-card__avatar" id="profile-avatar">
          <span id="profile-initials">–</span>
        </div>
        <div class="profile-card__info">
          <p class="profile-card__name" id="profile-name">
            <span class="skeleton" style="width: 180px"
              >&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span
            >
          </p>
          <p class="profile-card__role" id="profile-role">
            <span class="skeleton" style="width: 110px"
              >&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span
            >
          </p>
          <div class="profile-card__meta" id="profile-meta">
            <span class="skeleton" style="width: 160px"
              >&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span
            >
          </div>
        </div>
      </div>

      <!-- Interview card -->
      <div class="dash-card">
        <h1 class="dash-card__title" id="welcome" data-i18n="dashboard.welcome">Welcome</h1>
        <p class="dash-card__text" data-i18n="dashboard.cardText">
          When you're ready, start your interview. We'll run a quick security check first to make
          sure your environment is set up correctly.
        </p>

        <!-- Attempt tracker — hidden until profile loads -->
        <div class="attempt-tracker" id="attempt-tracker" style="display: none">
          <span class="attempt-tracker__label" data-i18n="dashboard.attemptsUsed">Attempts used</span>
          <div class="attempt-tracker__dots" id="attempt-dots"></div>
          <span class="attempt-tracker__count" id="attempt-count"></span>
        </div>

        <button class="btn-cta" id="take-interview-btn" type="button">
          <span data-i18n="dashboard.takeInterview">Take interview</span>
          <svg
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
          </svg>
        </button>
        <p class="dash-note" id="dash-note" data-i18n="dashboard.securityNote">A security check runs before the interview begins.</p>
        <p class="dash-note" style="margin-top:8px">
          <button type="button" onclick="window.electronAPI?.loadHowItWorks?.()" style="background:none;border:none;padding:0;color:#2563eb;font-size:inherit;font-family:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px" data-i18n="dashboard.howItWorksLink">How does the process work? →</button>
        </p>
      </div>
    </main>

    <script src="./js/i18n.js"></script>
    <script src="../src/renderer/languageSwitcher.js"></script>
    <script src="../src/renderer/dashboard.js"></script>
  </body>
</html>
